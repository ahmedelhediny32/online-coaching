<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استمارة العميل — Khaled Fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#050b14; --surface:#0b1320; --surface2:#1a2332;
  --ink:#ffffff; --ink-soft:#8e9aab; --line:#1e293b;
  --accent:#00bfff; --accent-dark:#0099cc; --accent-ink:#050b14;
  --warn:#f59e0b; --warn-bg:rgba(245,158,11,0.1); --ok-bg:rgba(0,191,255,0.1);
  --r:16px;
  --serif:'Inter', 'Cairo', system-ui, -apple-system, sans-serif;
  --display:'Inter', 'Cairo', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--serif);font-weight:400;font-size:15px;line-height:1.6;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.3;margin:0;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit;font-family:var(--serif)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:540px;margin:0 auto;padding:30px 20px 80px}
.hd{text-align:center;padding:10px 0 30px;border-bottom:1px solid var(--line);margin-bottom:30px}
.hd-logo{height:44px;width:auto;margin-bottom:16px;filter:brightness(0) invert(1)}
.credit{display:block;font-weight:500;font-size:12px;color:var(--ink-soft);letter-spacing:0.5px;margin-bottom:10px}
.hd h1{font-size:clamp(22px,5vw,28px);margin-top:0}
.lead{font-weight:400;color:var(--ink-soft);margin:12px auto 0;max-width:540px;font-size:14px;line-height:1.6;text-align:center}

.prog{display:flex;justify-content:space-between;align-items:center;position:relative;margin:0 0 24px;counter-reset:step;padding:0 10px}
.prog::before{content:'';position:absolute;top:50%;left:10px;right:10px;height:2px;background:var(--surface2);z-index:0;transform:translateY(-50%)}
.prog i{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px;font-weight:600;counter-increment:step;transition:all 0.3s}
.prog i::before{content:counter(step)}
.prog i.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 10px rgba(0,191,255,0.4)}

.stepname{display:flex;flex-direction:column-reverse;align-items:flex-start;margin:10px 0 30px}
.stepname small{font-weight:400;font-size:13px;color:var(--ink-soft);margin-bottom:6px}

.q{display:block;border:0;padding:0;margin:0 0 24px;min-width:0}
.ql{display:block;padding:0;font-size:15px;line-height:1.5;margin-bottom:12px;color:var(--ink);font-weight:500}
.hint{display:block;font-weight:400;font-size:12px;color:var(--ink-soft);margin-top:8px}
.err{display:block;font-size:13px;color:#ef4444;margin-top:6px}
.q input[type=text],.q input[type=tel],.q input[type=date],.q textarea{width:100%;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);line-height:1.5;color:var(--ink);transition:all 0.2s}
.q input:focus,.q textarea:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 1px var(--accent)}
.q input[dir="ltr"]{text-align:right}
.q textarea{resize:vertical;min-height:100px}
.q.bad input,.q.bad textarea{border-color:#ef4444}

.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 24px;min-height:48px;line-height:1.5;font-weight:500;transition:all 0.2s}
.opt:hover{border-color:rgba(0,191,255,0.5)}
.opt[aria-pressed="true"]{background:transparent;color:var(--accent);border-color:var(--accent)}
.opts.scale .opt{min-width:48px;padding:12px 0;text-align:center}
.ck{display:flex;gap:14px;align-items:flex-start;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:all 0.2s}
.ck:hover{border-color:rgba(0,191,255,0.5)}
.ck input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none;cursor:pointer}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;gap:16px}
.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border:none;background:var(--accent);color:var(--accent-ink);padding:14px 32px;border-radius:999px;font-weight:600;line-height:1.5;min-height:50px;transition:all 0.2s;flex:1}
.btn:hover{background:var(--accent-dark);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink-soft);border:none;flex:0 0 auto;padding:14px 24px}
.btn.ghost:hover{background:var(--surface);color:var(--ink);transform:none}
.btn.small{min-height:0;padding:8px 16px;font-size:13px}
.btn.big{display:block;width:100%;font-size:16px;padding:16px;flex:none}
.btn[aria-disabled="true"]{opacity:0.5;pointer-events:none}

.rv{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:24px;margin:0 0 16px}
.rvh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.rvh h2{font-size:17px;color:var(--ink);font-weight:600}
.qa{margin:0;display:grid;grid-template-columns:1fr;gap:4px 16px;font-size:14px}
.qa dt{font-weight:500;color:var(--ink-soft);margin-top:10px}
.qa dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.send{margin-top:32px;display:grid;gap:12px}
.note{border:1px solid var(--warn);background:var(--warn-bg);color:#f59e0b;border-radius:var(--r);padding:16px;font-size:14px}
.after{font-weight:400;color:var(--ink-soft);font-size:14px;margin:0;text-align:center}
.manual{width:100%;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:14px;color:var(--ink)}
.fallback{display:grid;gap:12px;border:1px dashed var(--warn);border-radius:var(--r);padding:16px}

.pdf-stage{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}
.pdf-page{position:relative;width:794px;height:1123px;overflow:hidden;background:#F3ECD6;color:#173524;direction:rtl;font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;font-weight:700;line-height:1.7;letter-spacing:0;margin:0}
.pdf-hero{background:#1E4A31;color:#F3ECD6;padding:30px 44px 26px}
.pdf-brand{font-weight:400;font-size:15px;color:#C9D7C0;direction:ltr;text-align:right}
.pdf-title{font-family:'Lalezar','Reem Kufi','Noto Kufi Arabic',sans-serif;font-weight:400;font-size:54px;line-height:1.15;margin-top:2px}
.pdf-name{font-family:'Lalezar','Reem Kufi','Noto Kufi Arabic',sans-serif;font-weight:400;font-size:34px;line-height:1.3;color:#A9CC94}
.pdf-date{font-weight:400;font-size:16px;color:#C9D7C0;margin-top:2px}
.pdf-slim{display:flex;justify-content:space-between;align-items:center;background:#1E4A31;color:#F3ECD6;padding:8px 44px;font-family:'Lalezar','Reem Kufi',sans-serif;font-weight:400;font-size:22px;line-height:1.5}
.pdf-body{padding:8px 44px 0}
.pdf-sec{padding-top:16px}
.pdf-sec div{background:#A9CC94;color:#173524;font-family:'Lalezar','Reem Kufi',sans-serif;font-weight:400;font-size:25px;line-height:1.5;padding:0 14px;border-radius:3px}
.pdf-row{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;padding:6px 0;border-bottom:1px solid #BDB59B;font-size:17px;line-height:1.7}
.pdf-row span:first-child{font-weight:400;color:#4B6555;font-size:16px}
.pdf-row span:last-child{white-space:pre-wrap;overflow-wrap:anywhere}
.pdf-foot{position:absolute;left:44px;right:44px;bottom:22px;display:flex;justify-content:space-between;font-weight:400;font-size:14px;color:#4B6555;border-top:2px solid #1E4A31;padding-top:6px}
.send .btn:disabled{opacity:0.5;cursor:default}

#pdfdoc{position:fixed;left:-10000px;top:0;width:794px;background:#ffffff;color:#0b1320;direction:rtl;font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.7;padding-bottom:28px}
#pdfdoc .phead{background:#050b14;color:#ffffff;padding:30px 36px 22px;margin-bottom:8px;border-bottom:4px solid #00bfff}
#pdfdoc .phead h1{font-family:var(--display);font-weight:700;font-size:48px;line-height:1.2;margin:0;color:#ffffff}
#pdfdoc .phead p{margin:4px 0 0;font-weight:500;font-size:16px;color:#8e9aab}
#pdfdoc .sec{padding:6px 36px 6px}
#pdfdoc h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.3;margin:15px 0 8px;padding-bottom:4px;border-bottom:2px solid #00bfff;color:#050b14}
#pdfdoc .row{display:grid;grid-template-columns:230px 1fr;gap:4px 16px;padding:8px 0;border-bottom:1px solid #e2e8f0}
#pdfdoc .k{font-weight:700;color:#1e293b}
#pdfdoc .v{white-space:pre-wrap;overflow-wrap:anywhere;color:#334155;font-weight:500}
.sendnote{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:20px;font-size:14px;color:var(--ink);text-align:center}
.sendnote strong{font-family:var(--display);font-weight:600;font-size:16px;display:block;color:var(--ink);margin-bottom:6px}
</style>
</head>

function h(tag, props){
  var el = document.createElement(tag), p = props || {};
  Object.keys(p).forEach(function(k){
    var v = p[k];
    if (k === 'class') el.className = v;
    else if (k === 'on') Object.keys(v).forEach(function(ev){ el.addEventListener(ev, v[ev]); });
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  });
  Array.prototype.slice.call(arguments, 2).forEach(function add(kid){
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) return kid.forEach(add);
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  });
  return el;
}

  var hint = f.h ? h('span', {class:'hint'}, f.h) : null;
  var err = h('span', {class:'err', role:'alert', hidden:true});
  if (f.type === 'choice' || f.type === 'multi' || f.type === 'scale'){
    return h('fieldset', {class:'q', 'data-k':f.k}, h('legend', {class:'ql'}, label), optionsEl(f), hint, err);
  }
  if (f.type === 'check'){
    var cb = h('input', {type:'checkbox'}); cb.checked = V[f.k] === 'نعم';
    cb.addEventListener('change', function(){ V[f.k] = cb.checked ? 'نعم' : ''; setErr(f.k, ''); save(); });
    return h('div', {class:'q', 'data-k':f.k}, h('label', {class:'ck'}, cb, h('span', {}, label)), err);
  }
  var input;
  if (f.type === 'textarea') input = h('textarea', {rows:3});
  else if (f.type === 'date') input = h('input', {type:'date'});
  else if (f.type === 'number') input = h('input', {type:'text', inputmode:'decimal', autocomplete:'off'});
  else if (f.type === 'tel') input = h('input', {type:'tel', dir:'ltr', inputmode:'tel', autocomplete:'tel'});
  else input = h('input', {type:'text', autocomplete:'off'});
  input.value = V[f.k] != null ? V[f.k] : '';
  input.addEventListener('input', function(){
    V[f.k] = (f.type === 'number' || f.type === 'tel') ? norm(input.value).trim() : input.value.trim();
    setErr(f.k, ''); save();
  });
  return h('label', {class:'q', 'data-k':f.k}, h('span', {class:'ql'}, label), input, hint, err);
}

/* validation */
function problem(f){
  var v = V[f.k];
  if (f.req && !has(v)) return 'مطلوب';
  if (!has(v)) return '';
  if (f.type === 'number'){
    var n = Number(v);
    if (!/^\d+(\.\d+)?$/.test(v) || (f.min != null && n < f.min) || (f.max != null && n > f.max)) return 'اكتب رقم صحيح';
  }
  if (f.type === 'tel' && String(v).replace(/\D/g,'').length < 10) return 'اكتب رقم صحيح';
  return '';
}
function validateStep(){
  var first = null;
  S[step].f.forEach(function(f){
    var m = problem(f); setErr(f.k, m);
    if (m && !first) first = f.k;
  });
  if (first){
    var el = body.querySelector('[data-k="' + first + '"]');
    el.scrollIntoView({block:'center'});
    var i = el.querySelector('input,textarea,button'); if (i) i.focus();
    return false;
  }
  return true;
}
function missing(){
  var out = [];
  S.forEach(function(s){ s.f.forEach(function(f){ if (problem(f)) out.push(f.l); }); });
  return out;
}

/* PDF: built in the browser from the answers, then WhatsApp opens on the coach's number */
function fileName(){
  var n = String(V.name || 'عميل').replace(/[\\\/:*?"<>|\s]+/g, '-').replace(/^-+|-+$/g, '');
  return 'استمارة-' + (n || 'عميل') + '.pdf';
}
function buildPdfDom(){
  var root = h('div', {id:'pdfdoc'});
  var dateStr = new Date().toLocaleDateString('ar-EG-u-nu-latn', {year:'numeric', month:'long', day:'numeric'});
  root.append(h('div', {class:'phead'}, h('h1', {}, 'استمارة عميل'),
    h('p', {}, (V.name ? V.name + ' — ' : '') + dateStr),
    h('p', {dir:'ltr'}, 'C/ Khaled Ahmed')));
  S.forEach(function(s){
    var rows = s.f.filter(function(f){ return has(V[f.k]); });
    if (!rows.length) return;
    var sec = h('section', {class:'sec cut'}, h('h2', {}, s.t));
    rows.forEach(function(f, i){
      sec.append(h('div', {class:'row' + (i > 0 ? ' cut' : '')}, h('div', {class:'k'}, f.l), h('div', {class:'v'}, show(V[f.k]))));
    });
    root.append(sec);
  });
  return root;
}
function makePdf(){
  if (!window.html2canvas || !window.jspdf) return Promise.reject(new Error('libs'));
  var root = buildPdfDom();
  document.body.append(root);
  var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  return ready.then(function(){
    var W = root.offsetWidth, H = root.offsetHeight, top = root.getBoundingClientRect().top, cuts = [];
    root.querySelectorAll('.cut').forEach(function(el){ cuts.push(Math.round(el.getBoundingClientRect().top - top)); });
    var scale = Math.max(1, Math.min(2, 15e6 / (W * H)));
    return window.html2canvas(root, {scale:scale, backgroundColor:'#F3ECD6', useCORS:true, logging:false}).then(function(canvas){
      root.remove();
      var doc = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
      var P0 = Math.floor(W * 289 / 210), P1 = Math.floor(W * 281 / 210);
      var sc = canvas.width / W, start = 0, idx = 0;
      while (start < H - 1){
        var limit = start + (idx === 0 ? P0 : P1), end;
        if (limit >= H) end = H;
        else {
          end = limit;
          for (var i = cuts.length - 1; i >= 0; i--){
            if (cuts[i] > start + 40 && cuts[i] <= limit){ end = cuts[i]; break; }
          }
        }
        var c2 = document.createElement('canvas');
        c2.width = canvas.width; c2.height = Math.max(1, Math.round((end - start) * sc));
        c2.getContext('2d').drawImage(canvas, 0, Math.round(start * sc), canvas.width, c2.height, 0, 0, canvas.width, c2.height);
        if (idx > 0) doc.addPage();
        doc.setFillColor(243, 236, 214); doc.rect(0, 0, 210, 297, 'F');
        doc.addImage(c2.toDataURL('image/jpeg', 0.92), 'JPEG', 0, idx === 0 ? 0 : 8, 210, (end - start) * 210 / W);
        start = end; idx++;
      }
      return doc.output('blob');
    });
  }).catch(function(e){ if (root.isConnected) root.remove(); throw e; });
}
function anchorSave(blob, name){
  var url = URL.createObjectURL(blob);
  var a = h('a', {href:url, download:name}); document.body.append(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 20000);
}
function saveBlob(blob, name){
  var use = (window.claude && window.claude.use) ? window.claude.use('downloads') : Promise.resolve(null);
  return use.catch(function(){ return null; }).then(function(dl){
    if (!dl){ anchorSave(blob, name); return; }
    return dl.save({filename:name, data:blob}).catch(function(e){ if (!(e && e.code === 'declined')) anchorSave(blob, name); });
  });
}
function sharePdf(blob, name){
  var file = new File([blob], name, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    return navigator.share({
      files:[file],
      title:'استمارة عميل — ' + (V.name||''),
      text:'استمارة عميل جديد — ' + (V.name||'')
    }).then(function(){ return 'shared'; });
  }
  return Promise.resolve('no-share');
}

/* review + send */
function review(){
  body.append(h('p', {class:'lead'}, 'راجع إجاباتك. لو تمام، دوس «ابعت الاستمارة».'));
  S.forEach(function(s, i){
    var rows = s.f.filter(function(f){ return has(V[f.k]); });
    if (!rows.length) return;
    var dl = h('dl', {class:'qa'});
    rows.forEach(function(f){ dl.append(h('dt', {}, f.l), h('dd', {}, show(V[f.k]))); });
    body.append(h('section', {class:'rv'},
      h('div', {class:'rvh'}, h('h2', {}, s.t),
        h('button', {type:'button', class:'btn ghost small', on:{click:function(){ step = i; render(); }}}, 'تعديل')), dl));
  });
  var miss = missing();
  var send = h('div', {class:'send'});
  if (miss.length){
    send.append(h('div', {class:'note', role:'alert'}, 'لسه ناقص: ' + miss.join('، ') + '. دوس «تعديل» على القسم وكمّله.'));
  }
  var status = h('p', {class:'after', role:'status'});
  var after = h('div', {class:'send', hidden:true});
  var go = h('button', {type:'button', class:'btn big', 'aria-disabled': String(miss.length > 0)}, 'ابعت الاستمارة');
  go.addEventListener('click', function(){
    if (miss.length || go.getAttribute('aria-busy') === 'true') return;
    go.setAttribute('aria-busy', 'true'); go.setAttribute('aria-disabled', 'true');
    status.textContent = 'بنجهز ملف الـ PDF…'; after.hidden = true;
    var name = fileName();
    makePdf().then(function(blob){
      status.textContent = 'الملف جاهز! بنفتحلك المشاركة…';
      return sharePdf(blob, name).then(function(result){
        if(result === 'shared'){
          /* User shared successfully via native share sheet */
          status.textContent = '✅ تم إرسال الاستمارة بنجاح!';
          after.replaceChildren(
            h('div', {class:'sendnote'}, h('strong', {}, '✅ تم بنجاح!'),
              'الاستمارة اتبعتت. المدرب هيراجعها ويتواصل معاك قريب.'),
            h('button', {type:'button', class:'btn ghost', on:{click:function(){ anchorSave(blob, name); }}}, '⬇️ نزّل نسخة PDF على جهازك'));
          after.hidden = false;
          try{ localStorage.removeItem(DRAFT); }catch(e){}
        } else {
          /* Web Share API not supported (desktop) — download PDF + open WhatsApp */
          anchorSave(blob, name);
          status.textContent = '📄 الملف نزل على جهازك.';
          var waText = '📋 *استمارة عميل جديد*\n\n';
          waText += '👤 الاسم: ' + (V.name||'') + '\n';
          if(V.phone) waText += '📱 الموبايل: ' + V.phone + '\n';
          if(V.goal) waText += '🎯 الهدف: ' + V.goal + '\n';
          waText += '\n📎 *الملف اتحمّل عندي — هبعته دلوقتي*';
          var waLink = 'https://wa.me/' + COACH + '?text=' + encodeURIComponent(waText);
          after.replaceChildren(
            h('div', {class:'sendnote'}, h('strong', {}, '📄 الملف نزل على جهازك'),
              'دوس على الزرار تحت عشان تفتح واتساب المدرب، وبعدين ارفق الملف «' + name + '» من جهازك.'),
            h('a', {class:'btn big', href:waLink, target:'_blank', rel:'noopener noreferrer'}, '📲 افتح واتساب المدرب'),
            h('button', {type:'button', class:'btn ghost', on:{click:function(){ anchorSave(blob, name); }}}, '⬇️ نزّل الـ PDF تاني'));
          after.hidden = false;
        }
      });
    }).catch(function(err){
      console.error(err);
      /* If user cancelled the share or PDF generation failed */
      if(err && err.name === 'AbortError'){
        status.textContent = 'تم إلغاء المشاركة. تقدر تحاول تاني.';
      } else {
        status.textContent = 'حصلت مشكلة. جرّب تاني أو اتأكد من النت.';
      }
    }).then(function(){
      go.removeAttribute('aria-busy'); go.setAttribute('aria-disabled', String(miss.length > 0));
    });
  });
  send.append(go, status, after);
  body.append(send);
}

/* shell */
function render(){
  body.replaceChildren();
  var prog = document.getElementById('prog'); prog.replaceChildren();
  for (var i = 0; i < TOTAL; i++) prog.append(h('i', {class: i <= step ? 'on' : ''}));
  var title = step < S.length ? S[step].t : 'راجع وابعت';
  var sn = document.getElementById('stepname');
  sn.replaceChildren(title, h('small', {}, 'الخطوة ' + (step+1) + ' من ' + TOTAL));
  var prev = document.getElementById('prev'), next = document.getElementById('next');
  prev.hidden = step === 0;
  if (step < S.length){
    S[step].f.forEach(function(f){ body.append(fieldEl(f)); });
    next.hidden = false;
    next.textContent = step === S.length - 1 ? 'راجع وابعت' : 'التالي';
  } else {
    review();
    next.hidden = true;
  }
  save();
  window.scrollTo(0, 0);
}
document.getElementById('next').addEventListener('click', function(){
  if (step < S.length && !validateStep()) return;
  step++; render();
});
document.getElementById('prev').addEventListener('click', function(){ if (step > 0){ step--; render(); } });
render();
})();
</script>
